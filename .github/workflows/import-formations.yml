# Mise à jour automatique des formations depuis l'open data Onisep,
# le 1er de chaque mois (et à la demande : onglet Actions → Run workflow).
#
# À configurer une fois dans GitHub : Settings → Secrets and variables → Actions
#   SUPABASE_URL               l'URL du projet Supabase
#   SUPABASE_SERVICE_ROLE_KEY  la clé service_role (jamais dans le code !)
name: Import des formations (Onisep)

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/import-formations.mjs --prune
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
